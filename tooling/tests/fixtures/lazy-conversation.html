<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Lazy Conversation Fixture</title>
    <style>
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #edf2f7; color: #172033; }
      header { padding: 18px 24px; background: #172033; color: white; }
      #main { height: 520px; overflow-y: auto; padding: 24px; }
      section { max-width: 760px; margin: 0 auto 16px; padding: 18px; border-radius: 14px; background: white; box-shadow: 0 5px 18px #18243a12; }
      section[data-role="user"] { border-left: 4px solid #2563eb; }
      section[data-role="assistant"] { border-left: 4px solid #16a36a; }
      #fixture-status { padding: 14px 24px; background: #fff; border-top: 1px solid #d8e0ea; font-weight: 700; }
    </style>
  </head>
  <body>
    <header><strong>Lazy ChatGPT conversation fixture</strong> · turns 11–20 render first</header>
    <main id="main" aria-label="Conversation"></main>
    <div id="fixture-status" role="status">Waiting for collector</div>
    <script src="../../../extension/src/contracts.js"></script>
    <script src="../../../extension/src/filename.js"></script>
    <script src="../../../extension/src/markdown.js"></script>
    <script src="../../../extension/src/attachments.js"></script>
    <script src="../../../extension/src/turn-normalizer.js"></script>
    <script src="../../../extension/src/chatgpt-adapter.js"></script>
    <script>
      const main = document.getElementById("main");
      function makeTurn(number) {
        const role = number % 2 ? "user" : "assistant";
        const section = document.createElement("section");
        section.dataset.turn = String(number);
        section.dataset.role = role;
        section.dataset.testid = `conversation-turn-${number}`;
        section.dataset.turnId = `fixture-turn-${number}`;
        const message = document.createElement("div");
        message.dataset.messageAuthorRole = role;
        message.dataset.messageId = `fixture-message-${number}`;
        if (number === 3) {
          message.innerHTML = `<p>Short visible introduction.</p><p hidden id="long-fixture-text">This text appears only after semantic expansion.</p><button aria-expanded="false" type="button">Show more</button><div role="group" aria-label="Pasted text(4).txt"><span data-testid="library-file-icon"></span>Pasted text(4).txt</div>`;
          const button = message.querySelector("button");
          button.addEventListener("click", () => {
            document.getElementById("long-fixture-text").hidden = false;
            button.setAttribute("aria-expanded", "true");
            button.textContent = "Show less";
          });
        } else if (number === 4) {
          message.innerHTML = `<p>Assistant response with <strong>bold text</strong> and code:</p><pre><code class="language-js">const turn = ${number};</code></pre>`;
        } else {
          message.innerHTML = `<p>${role === "user" ? "User" : "Assistant"} fixture message ${number}.</p>`;
        }
        section.append(message);
        return section;
      }
      for (let number = 11; number <= 20; number += 1) main.append(makeTurn(number));
      let loadedEarlier = false;
      main.addEventListener("scroll", () => {
        if (loadedEarlier || main.scrollTop > 1) return;
        loadedEarlier = true;
        const fragment = document.createDocumentFragment();
        const sentinel = document.createElement("div");
        sentinel.dataset.turnIdContainer = "client-created-root";
        fragment.append(sentinel);
        for (let number = 1; number <= 10; number += 1) fragment.append(makeTurn(number));
        main.prepend(fragment);
      });
      requestAnimationFrame(() => { main.scrollTop = main.scrollHeight; });
    </script>
  </body>
</html>
